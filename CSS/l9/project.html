<html>
    <head>
        <title>Positioning in html</title>
        <style>
            div{
                right: 30px;
                border: 3px dotted red;
            }
            .absolute{
                position: absolute;
                left: 50px;
                border: 3px solid blue;
            }
              .relative{
                position: relative;
                left: 100px;
                border: 3px solid green;
            }
              .fixed{
                position: fixed;
                top:0px;
                right: 20px;
                width: 200px;
                border: 3px solid yellow;
            }
            .sticky{
                position: sticky;
                top: 2px;
                right: 20px;
                width: 200px;
                border: 3px solid gold;
            } 
            h2{
                opacity: 0.5;
            }
            h1{
                opacity: 60%;
            }
        </style>
    </head>
    <body>
        <h2>Opacity 1</h2>
        <h1>Opacity2</h1>
        <h1>Positioning</h1>
        <div>Div with no position property</div>
        <div class="sticky">Secondly is that I love cycling mostly MTB</div>

        <div class="relative">
            So I have alot of hobbies
            <div class="absolute">One is go-karting with friends and family</div>
        </div>
        <div class="fixed">My Favouraite hobby</div>

        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
