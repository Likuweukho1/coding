<html>
    <head>
        <title>Scroll and Slide Adventure</title>
        <!--Bootstrap CSS and JS-->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

        <style>
            body{
                position: relative;
                scroll-behavior: smooth;
            }
            section {
                padding-top: 80px;
                height: 600px;
                color: white;
                text-align: center;
            }
            #section1 {background-color: #e79807;}
            #section2 {background-color: green;}
            #section3 {background-color: blue;}
        </style>
    </head>
    <body data-spy="scroll" data-target=".navbar" data-offset="50">

        <nav class="navbar navbar-inverse navbar-fixed-top">
            <div class="container-fluid">
                <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="clollapse" data-target="#myNavbar">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="#">Adventure</a>
                <ul class="nav navbar-nav">
                <li><a href="#section1">Home</a></li>
                <li><a href="#section2">Gallery</a></li>
                <li><a href="#section3">About</a></li>
                </ul>
                </div>
             </div>
        </nav>
        <section id="section1" class="container-fluid">
            <h1>Welcome to Scroll & Slide Adventure</h1>
            <div id="myCarousel" class="carousel slide" data-ride="carousel" style="width: 80%;margin: auto;">
                <ol class="carousel-indicators">
                    <li data-target="#mycarousel" data-slide-to="0" class="active"></li>
                     <li data-target="#mycarousel" data-slide-to="1"></li> 
                      <li data-target="#mycarousel" data-slide-to="2"></li>
                </ol>
                <div class="carousel-inner">
                    <div class="item active">
                        <img src="pic.jpg" alt="slide 1" style="width: 100%;">
                    </div>
               <div class="item ">
                       <img src="pic.jpg" alt="slide 2" style="width: 100%;">
                    </div>
                <div class="item "></div>
                       <img src="pic.jpg" alt="slide 3" style="width: 100%;">
                    </div>
                </div>
                <a class="left arousel-control" href="#mycarousel" data-slide-to="prev"></a>
            </div>
        </section> 
    </body>   
</html>
